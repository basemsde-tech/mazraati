@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
:root{
  --display:'Noto Naskh Arabic',Georgia,'Times New Roman',serif;
  --body:'Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overscroll-behavior-y:none}
button,a,label,input,select,textarea{touch-action:manipulation}
img{-webkit-user-drag:none}
input,textarea,select{font-size:16px}
button,input,textarea{font-family:var(--body)}
button{transition:opacity .1s ease}
button:active{opacity:.72}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid ${d.tag};outline-offset:1px}
input:focus,textarea:focus{border-bottom-color:${d.field}}
.app{min-height:100vh;min-height:100dvh;background:${d.bg};
  font-family:var(--body);color:${d.ink}}
.app.dk{background:${d.bg}}
.due-val{color:${d.red};font-weight:700}
.paid-val{color:${d.green};font-weight:700}
.part-val{color:${d.amber};font-weight:700}
.splash{min-height:100vh;min-height:100dvh;background:linear-gradient(165deg,${d.fieldDeep} 0%,${d.field} 55%,${d.field} 100%);
  display:grid;place-items:center;color:#fff;font-family:var(--body)}
.splash-inner{text-align:center;padding:24px}
.splash-logo{width:72px;height:72px;margin:0 auto 16px;border-radius:12px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.splash-logo img{width:100%;height:100%;object-fit:contain}
.splash-logo span{font-size:36px}
.splash-brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.splash-msg{margin-top:14px;font-size:14px;opacity:.85;font-weight:500}
.splash-spin{width:28px;height:28px;margin:18px auto 0;border:3px solid rgba(255,255,255,.25);
  border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gate{min-height:100vh;min-height:100dvh;background:${d.bg};font-family:var(--body);color:${d.ink}}
.gate-desk .gate-shell{flex-direction:row;align-items:stretch;min-height:100vh;min-height:100dvh}
.gate-desk .gate-hero{flex:0 0 38%;max-width:420px;display:flex;align-items:center;justify-content:center;padding:40px 28px}
.gate-desk .gate-panel{flex:1;max-width:none;margin:0;padding:36px 40px;justify-content:center}
.gate-desk .gate-card{max-width:640px;width:100%;margin:0;border-radius:10px;padding:28px 28px 24px;flex:0 1 auto}
.gate-shell{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.gate-hero{position:relative;background:linear-gradient(155deg,${d.fieldDeep} 0%,${d.field} 50%,#3a5088 100%);
  color:#fff;padding:calc(28px + env(safe-area-inset-top)) 20px 32px;overflow:hidden;flex-shrink:0}
.gate-hero-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gate-orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.35}
.gate-orb-a{width:180px;height:180px;background:${d.tag};top:-40px;inset-inline-end:-30px}
.gate-orb-b{width:140px;height:140px;background:${d.green};bottom:-20px;inset-inline-start:-20px}
.gate-hero-inner{position:relative;z-index:1;text-align:center;max-width:360px;margin:0 auto}
.gate-lang{position:absolute;top:0;inset-inline-end:0;border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);color:#fff;border-radius:4px;padding:7px 12px;font-size:12px;
  font-weight:700;cursor:pointer;font-family:var(--body)}
.gate-logo-wrap{width:76px;height:76px;margin:0 auto 14px;border-radius:12px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;overflow:hidden}
.gate-logo-img{width:100%;height:100%;object-fit:contain;padding:6px}
.gate-logo-fallback span{font-size:38px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.2))}
.gate-title{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1.2;letter-spacing:-.02em}
.gate-tagline{margin:8px 0 0;font-size:13.5;opacity:.88;font-weight:500;line-height:1.45}
.gate-species{display:flex;justify-content:center;gap:12px;margin-top:18px;font-size:26px;opacity:.95}
.gate-panel{flex:1;display:flex;flex-direction:column;padding:32px 28px calc(12px + env(safe-area-inset-bottom));
  margin-top:0;position:relative;z-index:2;width:100%;max-width:560px;margin-inline:auto;justify-content:center}
.gate-card{background:${d.card};border:1px solid ${d.line};border-radius:10px 10px 6px 6px;
  box-shadow:0 12px 40px rgba(27,32,51,.12);padding:22px 20px 20px;flex:1}
.gate-step{max-width:100%}
.gate-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.gate-span-2{grid-column:1 / -1}
.gate-steps{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;
  font-size:12.5px;font-weight:700;color:${d.inkSoft}}
.gate-steps-bar{display:flex;gap:6px;flex:1;max-width:160px}
.gate-steps-bar span{height:4px;flex:1;border-radius:2px;background:${d.line}}
.gate-steps-bar span.on{background:${d.field}}
.gate-logo-pick{display:flex;align-items:center;gap:14px}
.gate-logo-btn{width:88px;height:88px;border-radius:8px;border:1.5px dashed ${d.line};background:${d.paper};
  display:grid;place-items:center;cursor:pointer;overflow:hidden;flex-shrink:0;font-size:28px;padding:0;
  font-family:var(--body);color:${d.ink}}
.gate-logo-btn img{width:100%;height:100%;object-fit:contain}
.gate-soon{background:${d.paper};border:1px dashed ${d.line};border-radius:6px;padding:12px 14px}
.gate-soon-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.gate-soon-badge{font-size:11.5px;font-weight:700;color:#7A5312;background:#F6EFDD;border:1px solid ${d.tag};
  border-radius:4px;padding:6px 10px;white-space:nowrap}
.gate-h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0 0 6px;color:${d.ink}}
.gate-lead{font-size:14px;color:${d.inkSoft};font-weight:500;margin:0 0 18px;line-height:1.5}
.gate-label{font-size:14px;font-weight:700;color:${d.inkSoft};margin:0 0 8px}
.gate-err{color:${d.red};font-weight:700;font-size:14px;margin:10px 0 0;text-align:center}
.gate-actions{display:grid;gap:10px}
.gate-field{display:block;margin-bottom:4px}
.gate-field-label{display:block;font-size:12.5px;font-weight:700;color:${d.inkSoft};margin-bottom:6px}
.gate-role-row{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.gate-role{border:1.5px solid ${d.line};background:#fff;color:${d.ink};border-radius:99px;padding:8px 13px;
  font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--body)}
.gate-role.on{background:${d.field};border-color:${d.field};color:#fff}
.gate-avatar-row{display:flex;flex-wrap:wrap;gap:8px}
.gate-av-pick{width:46px;height:46px;border-radius:8px;font-size:24px;cursor:pointer;background:#fff;
  border:1.5px solid ${d.line};display:grid;place-items:center;padding:0}
.gate-av-pick.on{border-color:${d.field};background:${d.paper};box-shadow:0 0 0 2px ${d.field}33}
.gate-profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.gate-profile-card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:16px 10px;background:#fff;border:1.5px solid ${d.line};border-radius:8px;cursor:pointer;
  font-family:var(--body);text-align:center;transition:border-color .12s,box-shadow .12s}
.gate-profile-card:hover{box-shadow:0 4px 14px rgba(27,32,51,.08)}
.gate-profile-name{font-weight:700;font-size:15px;color:${d.ink}}
.gate-profile-role{font-size:11.5px;color:${d.inkSoft};font-weight:600}
.gate-lock{position:absolute;top:8px;inset-inline-end:8px;font-size:13px;opacity:.7}
.gate-add-profile{width:100%;border:2px dashed ${d.line};background:transparent;border-radius:8px;
  padding:14px;font-weight:700;font-size:15px;color:${d.field};cursor:pointer;font-family:var(--body)}
.gate-user-chip{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px;
  background:${d.paper};border-radius:8px;border:1px solid ${d.line}}
.gate-avatar{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;font-size:24px;flex-shrink:0}
.gate-avatar.lg{width:56px;height:56px;font-size:28px;border-radius:12px}
.gate-user-name{font-family:var(--display);font-weight:700;font-size:18px}
.gate-user-role{font-size:12.5px;color:${d.inkSoft};font-weight:600;margin-top:2px}
.gate-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px 0;
  font-size:11.5px;color:${d.inkSoft}}
.gate-ver{font-family:var(--mono)}
@media (max-width:900px){
  .gate-desk .gate-shell{flex-direction:column}
  .gate-desk .gate-hero{flex:none;max-width:none;padding:28px 20px}
  .gate-desk .gate-panel{padding:20px 16px}
  .gate-form-grid{grid-template-columns:1fr}
}
@keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.banner{display:flex;align-items:center;gap:10px;padding:9px 13px;font-weight:600;font-size:13.5px;
  border-bottom:1px solid ${d.line}}
.banner.amber{background:#F6EFDD;color:#7A5312}
.banner.green{background:#E8F5F0;color:#0F5C4D}
.banner.red{background:#F5E2E4;color:#7A1A2E}
.sheet-wrap{position:fixed;inset:0;background:rgba(27,32,51,.46);display:flex;align-items:center;
  justify-content:center;z-index:20;animation:fade .14s ease;padding:16px}
.sheet{background:${d.bg};width:100%;max-width:560px;max-height:86vh;max-height:86dvh;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  border-radius:5px;border-top:3px solid ${d.tag};padding:10px 16px 16px;
  box-shadow:0 20px 50px rgba(27,32,51,.3);animation:rise .2s cubic-bezier(.2,.9,.3,1)}
.grabber{display:none}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:${d.ink};color:#fff;
  border-radius:3px;padding:12px 20px;font-weight:600;z-index:30;animation:rise .16s ease}
.hscroll::-webkit-scrollbar{display:none}
.hscroll{scrollbar-width:none;border-bottom:1px solid ${d.line}}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:${d.line};border-radius:0}
@keyframes rise{from{transform:translateY(12px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------------------------- desktop ---------------------------- */
.dk-wrap{display:flex;min-height:100vh;min-height:100dvh;width:100%}
.dk-side{width:240px;flex-shrink:0;background:${d.field};color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;height:100dvh;border-inline-end:3px solid ${d.tag}}
.dk-brand{display:flex;align-items:center;gap:10px;padding:15px 14px;border-bottom:1px solid rgba(255,255,255,.14)}
.dk-nav{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;
  color:rgba(255,255,255,.82);border-radius:3px;padding:10px 11px;cursor:pointer;text-align:start;
  font-family:var(--body);font-weight:600;font-size:14px}
.dk-nav:hover{background:rgba(255,255,255,.10);color:#fff}
.dk-nav.on{background:#fff;color:${d.field}}
.nav-group{margin-bottom:4px}
.nav-group-head{display:flex;align-items:center;justify-content:space-between;width:100%;
  background:transparent;border:none;padding:8px 10px 5px;cursor:pointer;font-family:var(--body);
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dk-side .nav-group-head{color:rgba(255,255,255,.72)}
.dk-side .nav-group-head:hover{color:#fff}
.menu .nav-group-head{color:${d.inkSoft};padding:12px 0 6px}
.menu .nav-group-head:hover{color:${d.ink}}
.nav-group-chev{font-size:14px;transition:transform .15s ease;opacity:.75;display:inline-block;line-height:1}
.nav-group-chev.open{transform:rotate(90deg)}
[dir=rtl] .nav-group-chev.open{transform:rotate(-90deg)}
.nav-group-items{display:grid;gap:2px;padding-bottom:2px}
.menu .nav-group-items{margin-bottom:4px}
.dk-main{flex:1;min-width:0;display:flex;flex-direction:column}
.dk-top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:${d.paper};
  border-bottom:1px solid ${d.line};position:sticky;top:0;z-index:4}
.dk-search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid ${d.line};border-radius:3px;
  padding:8px 12px;min-width:230px;cursor:pointer;font-family:var(--body);font-size:13.5px;color:${d.inkSoft}}
.dk-search:hover{border-color:${d.field}}
.dk-pill{background:#fff;border:1px solid ${d.line};border-radius:3px;padding:7px 10px;cursor:pointer;
  font-family:var(--body);font-size:12.5px;font-weight:600;color:${d.ink}}
.dk-pill:hover{border-color:${d.field}}
.dk-pill.on{background:${d.field};border-color:${d.field};color:#fff}
.dk-quick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 22px;background:#fff;
  border-bottom:1px solid ${d.line}}
.dk-quick-btn{display:inline-flex;align-items:center;gap:5px;background:${d.paper};border:1px solid ${d.line};
  border-radius:3px;padding:6px 10px;cursor:pointer;font-family:var(--body);font-size:12.5px;font-weight:600;
  color:${d.ink};white-space:nowrap;line-height:1.2}
.dk-quick-btn:hover{border-color:${d.field}}
.dk-quick-btn.on{background:${d.field};border-color:${d.field};color:#fff}
.dk-quick-btn.accent{border-color:${d.field};color:${d.field};background:#fff}
.dk-quick-btn.accent:hover{background:${d.field};color:#fff}
.dk-quick-btn.back{font-weight:700}
.dk-quick-sep{width:1px;height:22px;background:${d.line};margin:0 4px;flex-shrink:0}
.dk-body{padding:20px 28px 48px;width:100%;max-width:none}
.dk-settings{max-width:640px}
.dk-settings-inner{display:grid;gap:8px}
.set-savebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;
  background:#FFF8E8;border:1px solid ${d.tag};border-radius:4px;font-size:13px;font-weight:700;color:#7A5312;
  position:sticky;top:0;z-index:2}
.set-sec{background:#fff;border:1px solid ${d.line};border-radius:5px;overflow:visible}
.set-sec-head{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;
  padding:11px 12px;cursor:pointer;text-align:start;font-family:var(--body);color:${d.ink}}
.set-sec-head:hover{background:${d.paper}}
.set-sec-ic{width:22px;text-align:center;font-size:15px;flex-shrink:0}
.set-sec-title{font-family:var(--display);font-weight:700;font-size:15px;display:inline-flex;align-items:center;flex-wrap:wrap}
.set-sec-sum{margin-inline-start:8px;flex:1;text-align:end;font-size:11.5px;font-weight:600;color:${d.inkSoft};
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.set-sec-head .nav-group-chev{margin-inline-start:8px;flex-shrink:0}
.set-sec-body{padding:0 12px 12px;display:grid;gap:0;border-top:1px solid ${d.line};padding-top:10px}
.set-grid-id{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.set-logo{width:64px;height:64px;border-radius:4px;background:${d.paper};border:1px solid ${d.line};
  display:grid;place-items:center;cursor:pointer;overflow:hidden}
.set-logo img{width:100%;height:100%;object-fit:contain}
.set-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.set-price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.help-tip-pop{position:absolute;z-index:20;top:calc(100% + 6px);inset-inline-start:0;min-width:200px;max-width:280px;
  background:${d.ink};color:#fff;border-radius:4px;padding:8px 10px;font-size:12px;font-weight:500;line-height:1.45;
  box-shadow:0 8px 20px rgba(0,0,0,.18);font-family:var(--body);white-space:normal}
@media (max-width:720px){
  .set-row2,.set-price-grid{grid-template-columns:1fr}
  .set-grid-id{grid-template-columns:56px 1fr}
}
.dk tbody tr:hover{background:${d.paper}}
.dk thead th{position:sticky;top:0;background:${d.paper};z-index:1}
.dk tfoot td{position:sticky;bottom:0;background:${d.paper}}
.dk table{font-variant-numeric:tabular-nums}
.pal-back{position:fixed;inset:0;background:rgba(27,32,51,.42);z-index:40;display:flex;
  align-items:flex-start;justify-content:center;padding-top:12vh;animation:fade .12s ease}
.pal{width:min(620px,92vw);background:${d.card};border:1px solid ${d.line};border-top:3px solid ${d.tag};
  border-radius:5px;box-shadow:0 20px 50px rgba(27,32,51,.28);overflow:hidden;animation:drop .14s ease}
.print-sheet{display:none}
@media print{
  .app > *:not(.print-sheet):not(.keep-print){display:none!important}
  .gate,.toast,.pal-back{display:none!important}
  .print-sheet{display:none!important}
  .print-sheet.show{display:block!important;position:static!important;width:100%}
  .sheet-wrap.keep-print{display:block!important;position:static;inset:auto;background:#fff;padding:0;animation:none}
  .sheet-wrap.keep-print .sheet{max-height:none;box-shadow:none;border:none;border-radius:0;padding:12px;margin:0;width:100%}
  .sheet-wrap.keep-print .grabber,.sheet-wrap.keep-print button,.no-print{display:none!important}
  body{background:#fff!important;margin:0}
  .print-sheet.show,.print-sheet.show *,.sheet-wrap.keep-print,.sheet-wrap.keep-print *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table,tr,td,th{page-break-inside:avoid}
  @page{size:A4;margin:10mm}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
