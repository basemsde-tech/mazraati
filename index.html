@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Kufi+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');
:root{
  --display:'Noto Naskh Arabic',Georgia,'Times New Roman',serif;
  --body:'Noto Kufi Arabic','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;overscroll-behavior-y:none}
button,a,label,input,select,textarea{touch-action:manipulation}
img{-webkit-user-drag:none}
input,textarea,select{font-size:16px}
button,input,textarea{font-family:var(--body)}
button{transition:opacity .1s ease}
button:active{opacity:.72}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid ${s.tag};outline-offset:1px}
input:focus,textarea:focus{border-bottom-color:${s.field}}
.app{min-height:100vh;min-height:100dvh;background:${s.bg};font-family:var(--body);color:${s.ink};
  padding-top:env(safe-area-inset-top)}
/* faint ruled paper behind everything */
.shell{max-width:520px;margin:0 auto;position:relative;min-height:100vh;min-height:100dvh;
  background-image:repeating-linear-gradient(${s.bg} 0 27px, ${s.line}44 27px 28px);
  background-attachment:local}
.splash{min-height:100vh;min-height:100dvh;background:${s.field};display:grid;place-items:center;color:#fff;font-family:var(--body)}
.gate{min-height:100vh;min-height:100dvh;background:${s.field};font-family:var(--body);
  padding:calc(28px + env(safe-area-inset-top)) 16px calc(44px + env(safe-area-inset-bottom));
  background-image:repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.05) 39px 40px)}
.topbar{background:${s.field};color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5;
  border-bottom:3px solid ${s.tag};padding-top:calc(12px + env(safe-area-inset-top))}
.tb{width:34px;height:34px;border-radius:3px;border:1px solid rgba(255,255,255,.28);
  background:transparent;color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;flex-shrink:0}
.wstrip{display:flex;align-items:center;gap:9px;padding:8px 14px;background:${s.paper};
  border-bottom:1px solid ${s.line};font-size:12.5px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.wstrip::-webkit-scrollbar{display:none}
.menu-back{position:fixed;inset:0;z-index:8;background:rgba(27,32,51,.28);animation:fade .12s ease}
.menu{position:absolute;top:60px;inset-inline:12px;z-index:9;background:${s.card};border:1px solid ${s.line};
  border-top:3px solid ${s.tag};border-radius:0 0 6px 6px;padding:14px 16px 12px;
  box-shadow:0 10px 24px rgba(27,32,51,.18);animation:drop .16s ease}
@keyframes drop{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.banner{display:flex;align-items:center;gap:10px;padding:9px 13px;font-weight:600;font-size:13.5px;
  border-bottom:1px solid ${s.line}}
.banner.amber{background:#F6EFDD;color:#7A5312}
.banner.red{background:#F5E2E4;color:#7A1A2E}
/* navigation reads as ledger index tabs */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:${s.paper};
  border-top:1px solid ${s.line};display:flex;padding:0 4px calc(4px + env(safe-area-inset-bottom));z-index:6}
.tabbar button{border-top:3px solid transparent;margin-top:-1px}
.tabbar button.on{border-top-color:${s.field};background:${s.card}}
.sheet-wrap{position:fixed;inset:0;background:rgba(27,32,51,.46);display:flex;align-items:flex-end;
  justify-content:center;z-index:20;animation:fade .14s ease}
.sheet{background:${s.bg};width:100%;max-width:520px;max-height:92vh;max-height:92dvh;overflow-y:auto;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  border-radius:10px 10px 0 0;border-top:4px solid ${s.tag};padding:10px 16px 16px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:rise .2s cubic-bezier(.2,.9,.3,1)}
.grabber{width:44px;height:3px;border-radius:0;background:${s.line};margin:2px auto 12px}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:${s.ink};color:#fff;
  border-radius:3px;padding:12px 20px;font-weight:600;z-index:30;animation:rise .16s ease}
.hscroll::-webkit-scrollbar{display:none}
.hscroll{scrollbar-width:none;border-bottom:1px solid ${s.line}}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:${s.line};border-radius:0}
@keyframes rise{from{transform:translateY(12px);opacity:.6}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------------------------- desktop ---------------------------- */
.dk{background:${s.bg}}
.dk-wrap{display:flex;min-height:100vh;min-height:100dvh}
.dk-side{width:228px;flex-shrink:0;background:${s.field};color:#fff;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;height:100dvh;border-inline-end:3px solid ${s.tag}}
.dk-brand{display:flex;align-items:center;gap:10px;padding:15px 14px;border-bottom:1px solid rgba(255,255,255,.14)}
.dk-nav{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;
  color:rgba(255,255,255,.82);border-radius:3px;padding:10px 11px;cursor:pointer;text-align:start;
  font-family:var(--body);font-weight:600;font-size:14px}
.dk-nav:hover{background:rgba(255,255,255,.10);color:#fff}
.dk-nav.on{background:#fff;color:${s.field}}
.dk-main{flex:1;min-width:0;display:flex;flex-direction:column}
.dk-top{display:flex;align-items:center;gap:12px;padding:12px 22px;background:${s.paper};
  border-bottom:1px solid ${s.line};position:sticky;top:0;z-index:4}
.dk-search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid ${s.line};border-radius:3px;
  padding:8px 12px;min-width:230px;cursor:pointer;font-family:var(--body);font-size:13.5px;color:${s.inkSoft}}
.dk-search:hover{border-color:${s.field}}
.dk-pill{background:#fff;border:1px solid ${s.line};border-radius:3px;padding:7px 10px;cursor:pointer;
  font-family:var(--body);font-size:12.5px;font-weight:600;color:${s.ink}}
.dk-pill:hover{border-color:${s.field}}
.dk-pill.on{background:${s.field};border-color:${s.field};color:#fff}
.dk-body{padding:18px 22px 40px;max-width:1560px;width:100%}
.dk-settings{max-width:620px}
.dk tbody tr:hover{background:${s.paper}}
.dk thead th{position:sticky;top:0;background:${s.paper};z-index:1}
.dk tfoot td{position:sticky;bottom:0;background:${s.paper}}
.dk table{font-variant-numeric:tabular-nums}
.pal-back{position:fixed;inset:0;background:rgba(27,32,51,.42);z-index:40;display:flex;
  align-items:flex-start;justify-content:center;padding-top:12vh;animation:fade .12s ease}
.pal{width:min(620px,92vw);background:${s.card};border:1px solid ${s.line};border-top:3px solid ${s.tag};
  border-radius:5px;box-shadow:0 20px 50px rgba(27,32,51,.28);overflow:hidden;animation:drop .14s ease}
/* dialogs become centred modals on a wide screen */
@media (min-width:1024px){
  .sheet-wrap{align-items:center}
  .sheet{max-width:560px;border-radius:5px;border-top:3px solid ${s.tag};max-height:86vh;
    box-shadow:0 20px 50px rgba(27,32,51,.3)}
  .grabber{display:none}
  .toast{bottom:28px}
}
.print-sheet{display:none}
@media print{.no-print{display:none!important}.wstrip,.menu,.menu-back{display:none!important}.print-sheet.show{display:block!important}body{background:#fff}table,svg{page-break-inside:avoid}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
